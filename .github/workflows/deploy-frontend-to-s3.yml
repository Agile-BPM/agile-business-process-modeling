# THIS WORKFLOW CURRENTLY ONLY WORKS FOR DEMO VERSION OF THIS APPLICATION (branch: demo)
name: Deploy Frontend to S3

on:
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: pmd-demo-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (prod)
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          set -e
          DIST_DIR=$(ls -d frontend/dist/* | head -n 1)
          aws s3 sync "$DIST_DIR" "s3://${{ env.S3_BUCKET }}/" --delete

      - name: No-cache for index.html
        run: |
          aws s3 cp "s3://${{ env.S3_BUCKET }}/index.html" "s3://${{ env.S3_BUCKET }}/index.html" \
            --metadata-directive REPLACE \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"
