<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMDAgile - Business Process Modeling for Agile Teams</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        header {
            padding: 24px 0;
            border-bottom: 1px solid #e5e5e5;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #2196f3;
            text-decoration: none;
        }

        .nav-links a {
            color: #666;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #1a1a1a;
        }

        .hero {
            padding: 120px 0 80px;
            text-align: center;
        }

        .hero h1 {
            font-size: 64px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        .hero p {
            font-size: 20px;
            color: #666;
            max-width: 720px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        .feature-icon svg {
            width: 24px;
            height: 24px;
            color: #ffffff;
        }

        .feature-card h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .feature-card p {
            color: #666;
            line-height: 1.6;
        }

        .cta h2 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        .cta p {
            font-size: 18px;
            color: #666;
            margin-bottom: 32px;
        }

        footer {
            padding: 48px 0;
            border-top: 1px solid #e5e5e5;
            text-align: center;
        }

        footer p {
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 42px;
            }

            .hero p {
                font-size: 18px;
            }

            .cta h2 {
                font-size: 36px;
            }

        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <nav>
            <a href="#" class="logo">PMDAgile</a>
        </nav>
    </div>
</header>

<section class="hero">
    <div class="container">
        <h1>Business process modeling<br>for agile teams</h1>
        <p>PMDAgile allows you to model business processes, link user stories and epics, visualize iterations, and analyze workflows in a unified environment.</p>
    </div>
</section>

<footer>
    <div class="container">
        <p>&copy; 2025 PMDAgile – Process Modeling for Agile Teams</p>
    </div>
</footer>
</body>
</html>
