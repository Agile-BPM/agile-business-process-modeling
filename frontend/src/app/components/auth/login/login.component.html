<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="logo">PMDAgile</h1>
            <h2>Welcome Back</h2>
            <p>Sign in to your account to continue</p>
        </div>

        <!-- Success message for verified users -->
        <div class="success-message" *ngIf="successMessage">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <p>{{ successMessage }}</p>
        </div>

        <form class="auth-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        [(ngModel)]="authRequest.email"
                        required
                        email
                        #emailInput="ngModel"
                        class="form-input"
                        [class.error]="emailInput.invalid && emailInput.touched"
                        placeholder="Enter your email"
                />
                <div class="error-message" *ngIf="emailInput.invalid && emailInput.touched">
                    <span *ngIf="emailInput.errors?.['required']">Email is required</span>
                    <span *ngIf="emailInput.errors?.['email']">Please enter a valid email</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-container">
                    <input
                            [type]="showPassword ? 'text' : 'password'"
                            id="password"
                            name="password"
                            [(ngModel)]="authRequest.password"
                            required
                            minlength="6"
                            #passwordInput="ngModel"
                            class="form-input"
                            [class.error]="passwordInput.invalid && passwordInput.touched"
                            placeholder="Enter your password"
                    />
                    <button
                            type="button"
                            class="password-toggle"
                            (click)="togglePasswordVisibility()"
                            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                    >
                        <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <div class="error-message" *ngIf="passwordInput.invalid && passwordInput.touched">
                    <span *ngIf="passwordInput.errors?.['required']">Password is required</span>
                    <span *ngIf="passwordInput.errors?.['minlength']">Password must be at least 6 characters</span>
                </div>
            </div>

            <div class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <button
                    type="submit"
                    class="submit-button"
                    [disabled]="loginForm.invalid || isLoading"
            >
                <span *ngIf="!isLoading">Sign In</span>
                <span *ngIf="isLoading" class="loading-spinner">
          <span class="spinner"></span>
          Signing in...
        </span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don&apos;t have an account? <a routerLink="/register" class="auth-link">Sign up</a></p>
        </div>
    </div>
</div>
